<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旧物创意作品获奖查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 50px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .search-box {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .search-box input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        #workName {
            flex: 1;
            min-width: 200px;
        }
        #verifyCode {
            width: 100px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            background: #e9ecef;
            border-radius: 5px;
            letter-spacing: 3px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        button {
            padding: 10px 20px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #337ecc;
        }
        .result {
            margin-top: 20px;
            font-size: 16px;
            line-height: 2;
        }
        .success {
            color: #67c23a;
        }
        .error {
            color: #f56c6c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>旧物改造创意作品获奖查询系统</h2>

        <!-- 查询+验证码区域 -->
        <div class="search-box">
            <input type="text" id="workName" placeholder="请输入作品名称进行查询">
            <input type="text" id="inputCode" placeholder="请输入验证码">
            <div id="verifyCode" title="点击刷新验证码"></div>
            <button onclick="checkQuery()">立即查询</button>
        </div>

        <!-- 结果展示区域 -->
        <div class="result" id="result"></div>
    </div>

    <script>
        // 作品数据（后台数据，页面不显示）
        const workData = [
            { id: 1, name: "奶茶袋改造纸巾盒", award: "二等奖" },
            { id: 2, name: "Kitty风铃", award: "二等奖" },
            { id: 3, name: "霸王枫叶", award: "二等奖" },
            { id: 4, name: "瑞幸废旧咖啡纸袋三五花球", award: "二等奖" },
            { id: 5, name: "风吟花信", award: "二等奖" },
            { id: 6, name: "瓶中花旧物生", award: "一等奖" },
            { id: 7, name: "残纸生莲", award: "二等奖" },
            { id: 8, name: "蝶舞新生·鞋盒收纳盒", award: "三等奖" },
            { id: 9, name: "废纸折叠收纳笔筒", award: "二等奖" }
        ];

        let codeStr = "";
        const codeDom = document.getElementById("verifyCode");
        const resultDom = document.getElementById("result");

        // 生成随机4位验证码
        function createCode() {
            const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
            codeStr = "";
            for (let i = 0; i < 4; i++) {
                const index = Math.floor(Math.random() * chars.length);
                codeStr += chars[index];
            }
            codeDom.innerText = codeStr;
        }

        // 初始化验证码
        window.onload = createCode;
        codeDom.onclick = createCode;

        // 查询功能
        function checkQuery() {
            const workName = document.getElementById("workName").value.trim();
            const inputCode = document.getElementById("inputCode").value.trim();

            // 验证码校验
            if (inputCode.toLowerCase() !== codeStr.toLowerCase()) {
                resultDom.innerHTML = "<p class='error'>验证码输入错误，请重新输入！</p>";
                createCode();
                return;
            }

            // 非空判断
            if (!workName) {
                resultDom.innerHTML = "<p class='error'>请输入要查询的作品名称！</p>";
                return;
            }

            // 模糊查询
            const filterData = workData.filter(item => item.name.includes(workName));
            if (filterData.length === 0) {
                resultDom.innerHTML = "<p class='error'>未查询到该作品的获奖信息！</p>";
            } else {
                let html = "<p class='success'>查询成功，获奖信息如下：</p>";
                filterData.forEach(item => {
                    html += `<p>序号：${item.id} &nbsp;&nbsp; 作品名称：${item.name} &nbsp;&nbsp; 获奖等级：${item.award}</p>`;
                });
                resultDom.innerHTML = html;
            }
        }
    </script>
</body>
</html>
